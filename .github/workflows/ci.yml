name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm source-generic:check
      - run: pnpm structure:check
      - run: pnpm lint
      - run: pnpm typecheck

  tests:
    name: Tests
    # The app ships on Windows, and some tests only hold there.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser tests
        shell: bash
        run: |
          pnpm --dir apps/desktop exec playwright install chromium
          CHROME_PATH="$(pnpm --dir apps/desktop exec node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          echo "NESTOR_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Create the temp root the script tests expect
        run: New-Item -ItemType Directory -Force (Join-Path (Split-Path -Qualifier $PWD) 'tmp') | Out-Null
      # A shared runner can't judge speed, so stopwatch and scale tests are
      # skipped here, and slow disks get a longer timeout. The two release-tool
      # tests need a sealed acceptance setup that only exists on a dev machine.
      - name: Tests
        run: >-
          pnpm exec vitest run --maxWorkers=4 --minWorkers=4
          --testTimeout=30000 --hookTimeout=30000
          --exclude "**/*.performance.test.*"
          --exclude "**/*.scale.test.*"
          --exclude "**/workspace-scale.test.ts"
          --exclude "apps/desktop/scripts/prepare-blind-persona-workspaces.test.ts"
          --exclude "apps/desktop/scripts/blind-resume-comparison-harness.test.ts"
